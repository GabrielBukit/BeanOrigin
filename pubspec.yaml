name: bean_origin
description: "BeanOrigin - Platform Rantai Pasok & Verifikasi Ekspor Kopi Nusantara"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # === Navigation & State Management ===
  go_router: ^14.6.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # === Database ===
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  sqflite: ^2.4.2
  path_provider: ^2.1.5

  # === Auth & Security ===
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  jwt_decoder: ^2.0.1

  # === Network ===
  http: ^1.2.2
  dio: ^5.7.0
  supabase_flutter: ^2.8.4

  # === Maps & Location ===
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  geocoding: ^3.0.0

  # === Sensors ===
  sensors_plus: ^6.1.1

  # === AI / ML ===
  tflite_flutter: ^0.11.0
  image: ^4.3.0

  # === Camera & Media ===
  image_picker: ^1.1.2
  camera: ^0.11.1

  # === QR Code ===
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # === Notifications ===
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # === Charts & UI ===
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  percent_indicator: ^4.2.4

  # === Utils ===
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
    - assets/lottie/
